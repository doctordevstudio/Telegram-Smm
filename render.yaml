# Render Blueprint - New + > Blueprint, point it at your repo. Fill the `sync: false` secrets in the dashboard.
services:
  - type: web
    name: telegram-smm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:api --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FIREBASE_DB_URL
        sync: false
      - key: FIREBASE_CRED_JSON
        sync: false
      - key: SESSION_KEY
        generateValue: true      # encrypts sessions at rest - NEVER change it after importing sessions
      - key: SECRET_KEY
        generateValue: true      # signs admin-panel cookies
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: UPI_ID
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: FORCE_CHANNEL
        sync: false
