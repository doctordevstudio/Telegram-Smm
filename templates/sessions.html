{% extends "base.html" %}
{% block content %}
<h2 class="text-3xl font-bold text-white mb-8">Session <span class="text-blue-500">Manager</span></h2>

<div class="glass p-12 rounded-xl text-center border-2 border-dashed border-gray-700 hover:border-cyan transition-colors mb-8" id="dropzone">
    <p class="text-gray-400 mb-4 text-lg">Drag & Drop .session files here</p>
    <input type="file" id="fileInput" multiple accept=".session" class="hidden">
    <button onclick="document.getElementById('fileInput').click()" class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:scale-105 transition-transform">
        BROWSE FILES
    </button>
</div>

<div class="glass rounded-xl p-6">
    <h3 class="text-xl font-bold mb-4 text-white">Active Database Sessions ({{ sessions|length }})</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        {% for session in sessions %}
        <div class="bg-dark p-4 rounded-lg border border-gray-800 flex justify-between items-center group hover:border-red-500/50 transition-colors">
            <span class="text-gray-300 font-mono text-sm truncate">{{ session }}</span>
            <form action="/api/delete_session/{{ session }}" method="POST">
                <button type="submit" class="opacity-0 group-hover:opacity-100 text-red-500 hover:bg-red-500/20 p-2 rounded transition-all">🗑️</button>
            </form>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const fd = new FormData();
        for (const file of e.target.files) fd.append('files', file);
        await fetch('/api/upload_sessions', { method: 'POST', body: fd });
        window.location.reload();
    });
</script>
{% endblock %}
