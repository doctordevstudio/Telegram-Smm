{% extends "base.html" %}
{% block content %}
<h2 class="text-3xl font-bold text-white mb-8">Service <span class="text-neon">Pricing</span></h2>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    {% for service in ['subscribers', 'views', 'reactions', 'livestream'] %}
    <div class="glass p-6 rounded-xl hover-glow transition-all">
        <h3 class="text-xl font-bold text-white capitalize mb-4 flex justify-between">
            {{ service }} 
            <span class="text-xs bg-neon/20 text-neon px-2 py-1 rounded">₹{{ plans.get(service, {}).get('unit_price', '0.0') }} / unit</span>
        </h3>
        <form action="/api/update_plan" method="POST" class="flex gap-4">
            <input type="hidden" name="service" value="{{ service }}">
            <input type="text" name="price" placeholder="New Unit Price" class="flex-1 bg-dark border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-cyan">
            <button type="submit" class="bg-cyan text-dark font-bold px-6 rounded hover:bg-cyan/80 transition-colors">UPDATE</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
