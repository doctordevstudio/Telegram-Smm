<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram SMM Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: '#0b1121', card: '#162032', neon: '#a855f7', cyan: '#06b6d4'} } } }
    </script>
    <style>
        body { background-color: #0b1121; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(22, 32, 50, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-text { text-shadow: 0 0 12px rgba(6, 182, 212, 0.6); }
        .hover-glow:hover { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border-color: #a855f7; }
        .nav-item { padding: 12px 20px; border-radius: 8px; margin-bottom: 8px; display: block; color: #94a3b8; transition: 0.3s; }
        .nav-item:hover { background: rgba(168, 85, 247, 0.1); color: #fff; border-left: 3px solid #a855f7; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-64 glass flex-col hidden md:flex h-full border-r border-gray-800">
        <div class="p-6 text-center border-b border-gray-800">
            <h1 class="text-2xl font-black text-cyan neon-text tracking-wider">SMM ADMIN</h1>
        </div>
        <nav class="flex-1 p-4 mt-2 overflow-y-auto">
            <a href="/dashboard" class="nav-item">📊 Dashboard</a>
            <a href="/plans" class="nav-item">📦 Plans</a>
            <a href="/payments" class="nav-item">💳 Payments</a>
            <a href="/sessions" class="nav-item">📂 Sessions</a>
            <a href="/settings" class="nav-item">⚙️ Settings</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <a href="/logout" class="text-red-400 hover:text-red-300 font-bold block text-center py-2 bg-red-500/10 rounded">Logout 🚪</a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-y-auto">
        <div class="p-6 md:p-10 pb-24">{% block content %}{% endblock %}</div>
        <footer class="fixed bottom-0 right-0 left-64 p-4 text-center text-xs glass text-gray-500 border-t border-gray-800">
            ©️ 2026 Copyright by <a href="https://dekhohatke.com" target="_blank" class="text-cyan hover:text-blue-400 font-bold transition-colors">dekhohatke.com</a>
        </footer>
    </main>
</body>
</html>
