<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14102b">
<title>Telegram SMM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
<div id="toasts" aria-live="polite"></div>

<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="logo-row"><span class="logo">🚀</span><h1>Telegram SMM</h1></div>
    <p class="muted">Owner login — this panel is private.</p>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary big" type="submit">Log in</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside id="drawer" class="drawer" aria-label="Navigation">
    <div class="brand"><span class="logo">🚀</span><b>Telegram SMM</b></div>
    <nav id="nav">
      <a href="#/home" data-p="home"><i>🏠</i>Dashboard</a>
      <a href="#/channels" data-p="channels"><i>📺</i>Channels</a>
      <a href="#/sessions" data-p="sessions"><i>🧩</i>Sessions</a>
      <a href="#/admins" data-p="admins"><i>👥</i>Admins</a>
      <a href="#/logs" data-p="logs"><i>📜</i>Logs</a>
      <a href="#/settings" data-p="settings"><i>⚙️</i>Setting</a>
    </nav>
    <button class="btn ghost" data-act="logout">Log out</button>
  </aside>
  <div id="scrim" class="scrim" data-act="menu"></div>

  <div class="main">
    <header class="top">
      <button class="burger" data-act="menu" aria-label="Open menu">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <span id="who" class="who"></span>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="foot">© 2026 Copyright by <a href="https://dekhohatke.com" target="_blank" rel="noopener noreferrer">dekhohatke.com</a></footer>
  </div>
</div>
<script src="/admin/static/app.js"></script>
</body>
</html>
